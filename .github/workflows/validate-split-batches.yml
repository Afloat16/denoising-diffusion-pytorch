name: Validate split-batch training

on:
  push:
    branches:
      - validation/ddp-split-batches-20261116

permissions:
  contents: read

jobs:
  cpu-gloo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      ACCELERATE_USE_CPU: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c8155b1dc622e3f1ef0d53dc6e5a570ca105bcec
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.5.1+cpu torchvision==0.20.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install accelerate==1.15.0 einops==0.8.2 ema-pytorch==0.8.3 numpy==1.26.4 pillow==11.3.0 pytorch-fid==0.3.0 scipy==1.13.1 pytest==8.3.5 huggingface-hub==0.25.2 safetensors==0.5.3
      - name: Verify unchanged code fails on batch size only
        run: |
          mkdir -p baseline/tests
          cp tests/test_trainer_split_batches.py baseline/tests/
          cd baseline
          set +e
          python -m pytest tests/test_trainer_split_batches.py -q --tb=short --basetemp=../before-data --junitxml=../before.xml > ../before.log 2>&1
          result=$?
          set -e
          cat ../before.log
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse('../before.xml').getroot().find('testsuite')
          assert int(suite.attrib['tests']) == 8, suite.attrib
          assert int(suite.attrib['errors']) == 0, suite.attrib
          assert int(suite.attrib['failures']) == 4, suite.attrib
          PY
      - name: Verify fixed native sharding and two-rank training
        run: |
          set -o pipefail
          python -m pytest tests/test_trainer_batch_shards.py tests/test_trainer_split_batches.py -q --tb=short --basetemp=after-data --junitxml=after.xml | tee after.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: split-batch-regression-evidence
          path: |
            before.log
            before.xml
            after.log
            after.xml
            before-data/**/*.json
            after-data/**/*.json
